name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
      skip_tap:
        description: "Skip the Homebrew tap update (intentional tap-less release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # The tap update is part of the release contract, so a missing token
      # fails HERE, before anything builds or publishes. Failing at the tap
      # step instead would publish the release first and then go red,
      # leaving a live release with a stale tap — the exact half-shipped
      # state this check exists to prevent (observed at v0.2.0, where the
      # old skip-and-exit-0 shipped a green run and a stale formula).
      - name: Require tap credentials
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tap) }}
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set. Mint a fine-grained PAT with Contents read/write on KalebKE/homebrew-tap and run: gh secret set HOMEBREW_TAP_GITHUB_TOKEN --repo KalebKE/RoboRanch. To ship without the tap on purpose, dispatch with skip_tap=true."
            exit 1
          fi
          # An existence check is not enough: a wrong-account or wrong-scope
          # token would pass here and fail after the release is published.
          # Prove the token can actually reach the tap repo before building.
          if ! git ls-remote "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/KalebKE/homebrew-tap.git" HEAD > /dev/null 2>&1; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is set but cannot read KalebKE/homebrew-tap. It needs a fine-grained PAT with Contents read/write on that repo (an org token or read-only token will not work)."
            exit 1
          fi

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build artifacts
        run: scripts/build-release-artifacts.sh "${{ steps.version.outputs.tag }}" dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Update Homebrew tap
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tap) }}
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/KalebKE/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/render-homebrew-formula.sh "$TAG" dist/checksums.txt > tap/Formula/roboranch.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/roboranch.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date."
            exit 0
          fi
          git commit -m "Update roboranch to ${TAG}"
          git push

